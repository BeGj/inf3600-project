# Launches the inpainting backend (FastAPI + SD1.5/LoRA) and the frontend (Vite
# build served by nginx). The browser streams COGs and calls the backend
# directly, so the frontend is built with VITE_API_URL pointing at the backend's
# host-published URL (http://localhost:8000), not its in-network name.
#
#   docker compose up --build
#     frontend  -> http://localhost:5173
#     backend   -> http://localhost:8000  (docs at /docs)
#
# Real inference needs an NVIDIA GPU; see the `deploy` block on the backend.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:80"
    environment:
      # Set to 0 on first run to allow the ~2GB base model download.
      HF_INPAINT_LOCAL_ONLY: "${HF_INPAINT_LOCAL_ONLY:-0}"
      # Optional: token for gated models. REQUIRED for the `flux-fill` registry
      # entry (black-forest-labs/FLUX.1-Fill-dev is gated) — without it that model
      # 401s at load time. Export HF_TOKEN in your shell before `up`.
      HF_TOKEN: "${HF_TOKEN:-}"
      # Persist the model cache inside the mounted volume.
      HF_HOME: /huggingface
    volumes:
      # Cache downloaded weights across restarts.
      - hf-cache:/huggingface
      # LoRA adapter weights live here (git-ignored, exported via
      # scripts/export_lora.py). Bind-mounting them means a `docker compose
      # restart` picks up newly-trained adapters without rebuilding the image,
      # and avoids baking large weights into the image. registry.json is the
      # source of truth for what's advertised at /models.
      - ./backend/models:/app/models
    # GPU access. Requires the NVIDIA Container Toolkit on the host.
    # Comment this block out to run CPU-only (slow).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time (read in src/api.ts).
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-cache:
